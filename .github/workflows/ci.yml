name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run analyze.py
        run: |
          python3 analysis/analyze.py data/keep.md

      - name: Run compare.py (no predictions file)
        run: |
          python3 predictions/compare.py predictions/predictions.jsonl || true
